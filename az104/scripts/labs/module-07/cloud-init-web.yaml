#cloud-config
# cloud-init-web.yaml — serveurs web du portail client Arvéo (vm-stNN-web01, vm-stNN-web02)
# Exécuté UNE FOIS, au premier démarrage : installation de nginx et page v1.
# La zone est lue sur le service de métadonnées d'instance (IMDS) : « aucune » hors zone.
# Prérequis : accès sortant à Internet (passerelle NAT ng-stNN-app, lab 07.2).
package_update: true
packages:
  - nginx
runcmd:
  - |
    ZONE=$(curl -s -H Metadata:true --max-time 5 \
      "http://169.254.169.254/metadata/instance/compute/zone?api-version=2021-02-01&format=text")
    echo "<h1>Arveo - portail client v1</h1><p>Serveur : $(hostname) - zone ${ZONE:-aucune}</p>" \
      > /var/www/html/index.html
  - systemctl enable --now nginx
