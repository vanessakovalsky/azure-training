# nginx.conf — API de suivi des colis Arvéo (conteneur, port 8080)
# Même contrat que la version VM du module 7 : JSON avec "service":"api-suivi-colis".
# Journaux sur la sortie standard : visibles par az container logs / kubectl logs.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  access_log /dev/stdout;
  server {
    listen 8080 default_server;
    location /health {
      default_type text/plain;
      return 200 "OK\n";
    }
    location / {
      default_type application/json;
      return 200 '{"service":"api-suivi-colis","version":"2.0","plateforme":"conteneur","instance":"$hostname"}\n';
    }
  }
}
